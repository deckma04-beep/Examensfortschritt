  </div>`;

  const v = $('#view-log');
  bindEntryForm(v, 'q');
  $('#quickForm').onsubmit = ev => {
    ev.preventDefault();
    const e = readEntryForm(v, 'q');
    if (!validEntry(e)) return;
    lastSubj = e.subjectId;
    addEntry(e);
    toast(`✅ ${fmtDur(e.minutes)} ${subjShort(e.subjectId)} eingetragen`);
    renderLog(); updateChip();
    checkRewards();
  };
  $('#logFilter').onchange = ev => { ui.logFilter = ev.target.value; ui.logLimit = 40; saveUi(); renderLog(); };
  $('#moreEntries') && ($('#moreEntries').onclick = () => { ui.logLimit += 40; renderLog(); });
  $$('[data-start]', v).forEach(b => b.onclick = () => startTimer(b.dataset.start));
  if (tm) {
    $('#timerTopic').oninput = ev => { state.timer.topic = ev.target.value; save(); };
    $('#timerStop').onclick = stopTimer;
    $('#timerCancel').onclick = async () => { if (await askConfirm('Timer verwerfen? Die Zeit wird nicht gespeichert.', 'Verwerfen', true)) { state.timer = null; save(); renderLog(); updateChip(); } };
    tickTimer();
  }
  $$('[data-edit]', v).forEach(b => b.onclick = () => editEntry(b.dataset.edit));
  $$('[data-del]', v).forEach(b => b.onclick = async () => {
    const e = state.entries.find(x => x.id === b.dataset.del);
    if (await askConfirm(`Eintrag „${esc(subjShort(e.subjectId))}, ${fmtDur(e.minutes)} am ${fmtDate(e.date)}“ löschen?`, 'Löschen', true)) { deleteEntry(e.id); toast('Eintrag gelöscht'); renderLog(); }
  });
}

function editEntry(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  openModal({ title: 'Eintrag bearbeiten', body: entryFormHTML(e, 'ed'), onMount: r => bindEntryForm(r, 'ed'),
    actions: [{ label: 'Abbrechen' }, { label: 'Speichern', cls: 'primary', onClick: r => {
      const n = readEntryForm(r, 'ed');
      if (!validEntry(n)) return false;
      Object.assign(e, n); save();
      toast('Eintrag gespeichert'); renderCurrent(); checkRewards();
    } }] });
}

function startTimer(sid) {
  if (state.timer) { toast('Es läuft bereits ein Timer.'); return; }
  state.timer = { subjectId: sid, start: Date.now(), topic: '' };
  save(); renderLog(); updateChip();
  toast(`▶ Timer für ${subjShort(sid)} gestartet`);
}
async function stopTimer() {
  const tm = state.timer;
  if (!tm) return;
  const min = Math.round((Date.now() - tm.start) / 60000);
  if (min < 1) {
    if (await askConfirm('Weniger als eine Minute gelernt – Timer verwerfen?', 'Verwerfen', true)) { state.timer = null; save(); renderLog(); updateChip(); }
    return;
  }
  state.timer = null;
  addEntry({ subjectId: tm.subjectId, date: dkey(new Date(tm.start)), minutes: min, topic: (tm.topic || '').trim() }, 'timer');
  toast(`✅ ${fmtDur(min)} ${subjShort(tm.subjectId)} gespeichert`);
  renderLog(); updateChip();
  checkRewards();
}
function elapsedStr() {
  if (!state.timer) return '';
  const s = Math.floor((Date.now() - state.timer.start) / 1000);
  return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}
function tickTimer() {
  const c = $('#timerClock'); if (c) c.textContent = elapsedStr();
  if (state.timer) $('#timerChipText').textContent = subjShort(state.timer.subjectId) + ' ' + elapsedStr().slice(0, 5);
}
function updateChip() { $('#timerChip').classList.toggle('on', !!state.timer); tickTimer(); }
setInterval(tickTimer, 1000);

/* =========================================================
   Planer
   ========================================================= */
function occurrencesForDay(k) {
  const out = [];
  for (const b of state.plan.blocks) {
    let ok = false;
    if (!b.recurring) ok = b.date === k;
    else ok = wdIdx(b.date) === wdIdx(k) && k >= b.date && (!b.until || k <= b.until) && !b.exceptions.includes(k);
    if (ok) out.push({ block: b, date: k, key: b.id + '|' + k, start: b.start, dur: b.duration });
  }
  return out.sort((a, b) => a.start - b.start);
}
function isDone(key) { const id = state.plan.done[key]; return !!(id && state.entries.some(e => e.id === id)); }
function toggleDone(blockId, date) {
  const b = state.plan.blocks.find(x => x.id === blockId);
  if (!b || b.type !== 'learn') return;
  const key = b.id + '|' + date;
  if (date > todayKey()) { toast('Zukünftige Blöcke kannst du erst am jeweiligen Tag abhaken.'); return; }
  if (isDone(key)) {
    deleteEntry(state.plan.done[key]);
    delete state.plan.done[key]; save();
    toast('Haken entfernt – Lernzeit wieder ausgetragen');
  } else {
    const e = addEntry({ subjectId: b.subjectId, date, minutes: b.duration, topic: b.topic || '', note: 'Aus dem Wochenplan' }, 'plan', key);
    state.plan.done[key] = e.id; save();
    toast(`✅ ${fmtDur(b.duration)} ${subjShort(b.subjectId)} als Lernzeit erfasst`);
    checkRewards();
  }
  renderCurrent();
}

function layoutDay(occ) {
  // einfache Spaltenaufteilung bei Überschneidungen
  const lanes = [];
  occ.forEach(o => {
    let l = lanes.findIndex(end => end <= o.start);
    if (l < 0) { l = lanes.length; lanes.push(0); }
    lanes[l] = o.start + o.dur; o.lane = l;
  });
  occ.forEach(o => { o.lanes = Math.max(1, ...occ.filter(p => p.start < o.start + o.dur && o.start < p.start + p.dur).map(p => p.lane + 1)); });
  return occ;
}

function renderPlan() {
  const t = todayKey(), curMon = mondayOf(t), mon = ui.planWeek || curMon, A = agg();
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const H = (P_END - P_START) * HPX;
  let grid = `<div class="ph"></div>`;
  const occByDay = days.map(k => layoutDay(occurrencesForDay(k)));
  days.forEach((k, i) => {
    const planned = occByDay[i].filter(o => o.block.type === 'learn').reduce((a, o) => a + o.dur, 0);
    grid += `<div class="ph ${k === t ? 'today' : ''}">${WD[i]} <small>${fmtDateShort(k)}</small><div class="sum">${planned ? '📘 ' + fmtH(planned) : '&nbsp;'}${A.byDate[k] ? ' · ✓ ' + fmtH(A.byDate[k]) : ''}</div></div>`;
  });
  grid += `<div class="ptimes" style="height:${H}px">${Array.from({ length: P_END - P_START }, (_, i) => i ? `<div style="top:${i * HPX}px">${pad(P_START + i)}:00</div>` : '').join('')}</div>`;
  days.forEach((k, i) => {
    let blocks = '';
    for (const o of occByDay[i]) {
      const b = o.block, top = (o.start - P_START * 60) / 60 * HPX, h = Math.max(18, o.dur / 60 * HPX - 2);
      const learn = b.type === 'learn', done = learn && isDone(o.key);
      const title = learn ? subjShort(b.subjectId) : (b.title || (b.type === 'break' ? 'Pause' : 'Termin'));
      const w = 100 / o.lanes;
      blocks += `<div class="pblock ${learn ? '' : 'fixed'} ${done ? 'done' : ''}" data-bid="${b.id}" data-date="${k}"
        style="--c:${learn ? subjColor(b.subjectId) : 'var(--fixed)'};top:${top}px;height:${h}px;left:calc(${o.lane * w}% + 2px);width:calc(${w}% - 4px)"
        title="${esc(title)}${b.topic ? ' – ' + esc(b.topic) : ''} (${minToTime(o.start)}–${minToTime(o.start + o.dur)})">
        ${learn ? `<button class="pb-check" data-check="1" title="${done ? 'Haken entfernen' : 'Erledigt – als Lernzeit erfassen'}">${done ? '✓' : ''}</button>` : ''}
        <div class="pb-time">${minToTime(o.start)}–${minToTime(o.start + o.dur)} ${b.recurring ? '<span class="rec" title="wöchentlich">🔁</span>' : ''}</div>
        <div class="pb-t">${b.type === 'break' ? '☕ ' : !learn ? '📌 ' : ''}${esc(title)}</div>
        ${b.topic && h > 40 ? `<div class="tiny muted">${esc(b.topic)}</div>` : ''}
      </div>`;
    }
    let nowLine = '';
    if (k === t) {
      const n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
      if (nm >= P_START * 60 && nm <= P_END * 60) nowLine = `<div class="now-line" style="top:${(nm - P_START * 60) / 60 * HPX}px"></div>`;
    }
    grid += `<div class="pday ${k === t ? 'today' : ''}" data-date="${k}" style="height:${H}px;--hpx:${HPX}px">${blocks}${nowLine}</div>`;
  });

  // Vergleich geplant vs. tatsächlich
  const plannedBy = {}; let plannedTot = 0, fixedTot = 0;
  occByDay.flat().forEach(o => {
    if (o.block.type === 'learn') { plannedBy[o.block.subjectId] = (plannedBy[o.block.subjectId] || 0) + o.dur; plannedTot += o.dur; }
    else fixedTot += o.dur;
  });
  const actualTot = weekMinutes(A, mon), wg = weeklyGoal(mon);
  const rows = state.subjects.map(x => {
    const p = plannedBy[x.id] || 0, a = weekMinutes(A, mon, x.id), g = subjWeeklyGoal(mon, x.id);
    return `<tr><td><span class="dot" style="background:${x.color}"></span> ${esc(x.short)}</td><td>${p ? fmtH(p) : '–'}</td><td>${a ? fmtH(a) : '–'}</td>
      <td>${g ? fmtH(g) : '–'}</td><td style="min-width:110px">${pbar(p ? a / p : 0, a >= p && p ? 'var(--ok)' : x.color)}</td></tr>`;
  }).join('');
  let verdict = '';
  if (wg) {
    const cov = plannedTot / wg;
    verdict = cov >= 1
      ? `<div class="hint ok"><span class="hi">👍</span><div>Dein Plan deckt das Wochenziel ab (${fmtH(plannedTot)} geplant / ${fmtH(wg)} Ziel).</div></div>`
      : `<div class="hint"><span class="hi">📌</span><div>Dein Plan deckt erst ${Math.round(cov * 100)} % des Wochenziels ab – es fehlen noch <b>${fmtDur(wg - plannedTot)}</b> geplante Lernzeit.</div></div>`;
  }
  const neglected = state.entries.length ? state.subjects.filter(x => { const l = A.lastBySubj[x.id]; return !l || l < addDays(t, -13); }) : [];

  $('#view-plan').innerHTML = `
  <div class="view-head"><h1>Wochenplaner</h1>
    <div class="row" style="gap:6px"><button class="btn sm" data-pw="-1">‹</button>
    <span style="font-weight:650;min-width:170px;text-align:center">KW ${isoWeek(mon)} · ${fmtDateShort(mon)}–${fmtDateShort(addDays(mon, 6))}${parseKey(addDays(mon, 6)).getFullYear()}</span>
    <button class="btn sm" data-pw="1">›</button>${mon !== curMon ? '<button class="btn sm" data-pw="0">Heute</button>' : ''}
    <button class="btn primary sm" id="newBlock">＋ Block</button></div></div>
  ${neglected.length ? `<div class="hint mb"><span class="hi">⚠️</span><div>In den letzten 14 Tagen vernachlässigt: ${neglected.map(x => `<b style="color:${x.color}">${esc(x.short)}</b>`).join(', ')}. Plane dafür einen Block ein!</div></div>` : ''}
  <div class="row between mb"><div class="legend">${state.subjects.map(x => `<span><i class="dot" style="background:${x.color}"></i>${esc(x.short)}</span>`).join('')}<span><i class="dot" style="background:var(--fixed)"></i>Termin/Pause</span></div>
    <span class="muted tiny">Klick ins Raster = neuer Block · Ziehen = verschieben · ○ = abhaken</span></div>
  <div class="planner-scroll mb" id="plannerScroll"><div class="planner" id="planner">${grid}</div></div>
  <div class="card"><div class="card-head"><h2>Geplant vs. tatsächlich gelernt</h2><span class="muted small">KW ${isoWeek(mon)}</span></div>
    <div class="grid g3 mb" style="gap:10px">
      <div><div class="stat-label">Geplant</div><div class="big-num" style="font-size:1.5rem">${fmtH(plannedTot)}</div></div>
      <div><div class="stat-label">Gelernt</div><div class="big-num" style="font-size:1.5rem;color:${actualTot >= plannedTot && plannedTot ? 'var(--ok)' : 'inherit'}">${fmtH(actualTot)}</div></div>
      <div><div class="stat-label">Wochenziel</div><div class="big-num" style="font-size:1.5rem">${wg ? fmtH(wg) : '–'}</div>${wg ? `<div class="small muted">${Math.round(actualTot / wg * 100)} % erreicht</div>` : ''}</div>
    </div>
    ${verdict ? `<div class="mb">${verdict}</div>` : ''}
    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Prüfung</th><th>Geplant</th><th>Gelernt</th><th>Ziel/Woche</th><th>Plan erfüllt</th></tr></thead>
    <tbody>${rows}<tr class="total"><td>Summe</td><td>${fmtH(plannedTot)}</td><td>${fmtH(actualTot)}</td><td>${wg ? fmtH(wg) : '–'}</td><td>${pbar(plannedTot ? actualTot / plannedTot : 0, 'var(--accent)')}</td></tr></tbody></table></div>
    ${fixedTot ? `<p class="muted small">Zusätzlich ${fmtH(fixedTot)} feste Termine/Pausen eingetragen.</p>` : ''}
  </div>`;

  const sc = $('#plannerScroll');
  // zur aktuellen Uhrzeit bzw. 8 Uhr scrollen (nur vertikal im Fenster nicht nötig)
  $$('[data-pw]').forEach(b => b.onclick = () => { const d = +b.dataset.pw; ui.planWeek = d === 0 ? null : addDays(mon, d * 7); if (ui.planWeek === curMon) ui.planWeek = null; renderPlan(); });
  $('#newBlock').onclick = () => blockModal(null, { date: mon <= t && t <= addDays(mon, 6) ? t : mon, start: 9 * 60 });
  bindPlannerDnD(sc);
}

function bindPlannerDnD(sc) {
  const planner = $('#planner');
  // Klick ins leere Raster
  $$('.pday', planner).forEach(col => col.addEventListener('click', ev => {
    if (ev.target !== col) return;
    const y = ev.offsetY, m = Math.floor((P_START * 60 + y / HPX * 60) / 30) * 30;
    blockModal(null, { date: col.dataset.date, start: clamp(m, P_START * 60, P_END * 60 - 30) });
  }));
  $$('.pblock', planner).forEach(el => {
    let sx, sy, moved = false, origTop, cols, startCol, pid;
    el.addEventListener('pointerdown', ev => {
      if (ev.target.closest('[data-check]')) return;
      if (ev.button !== 0) return;
      sx = ev.clientX; sy = ev.clientY; moved = false; origTop = parseFloat(el.style.top);
      cols = $$('.pday', planner).map(c => c.getBoundingClientRect());
      startCol = $$('.pday', planner).indexOf(el.parentElement);
      pid = ev.pointerId; el.setPointerCapture(pid);
    });
    el.addEventListener('pointermove', ev => {
      if (pid !== ev.pointerId || sx == null) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 6) return;
      moved = true; el.classList.add('dragging');
      const snap = HPX / 4;
      const nt = clamp(Math.round((origTop + dy) / snap) * snap, 0, (P_END - P_START) * HPX - snap);
      let ci = cols.findIndex(r => ev.clientX >= r.left && ev.clientX < r.right);
      if (ci < 0) ci = ev.clientX < cols[0].left ? 0 : 6;
      el.style.top = nt + 'px';
      el.style.transform = `translateX(${cols[ci].left - cols[startCol].left}px)`;
      el.dataset.ci = ci; el.dataset.nt = nt;
    });
    const end = ev => {
      if (pid !== ev.pointerId || sx == null) return;
      sx = null;
      const b = state.plan.blocks.find(x => x.id === el.dataset.bid);
      if (!moved) { if (ev.type === 'pointerup') blockModal(b, { date: el.dataset.date }); return; }
      const ci = +(el.dataset.ci ?? startCol), nt = +(el.dataset.nt ?? origTop);
      const newStart = Math.round(P_START * 60 + nt / HPX * 60);
      const dayDelta = ci - startCol;
      b.start = clamp(newStart, P_START * 60, P_END * 60 - 15);
      if (dayDelta) {
        b.date = addDays(b.date, dayDelta);
        if (b.until) b.until = addDays(b.until, dayDelta);
      }
      save(); renderPlan();
      toast(b.recurring ? 'Serie verschoben' : 'Block verschoben');
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    $('[data-check]', el)?.addEventListener('click', ev => { ev.stopPropagation(); toggleDone(el.dataset.bid, el.dataset.date); });
  });
}

function blockModal(b, ctx) {
  const isNew = !b;
  const d = b || { type: 'learn', subjectId: lastSubj || state.subjects[0]?.id, topic: '', title: '', date: ctx.date, start: ctx.start, duration: 90, recurring: false, until: '', exceptions: [] };
  const body = `<div class="form-grid">
    <div class="c12"><div class="seg" id="bType">${[['learn', '📘 Lernblock'], ['fixed', '📌 Fester Termin'], ['break', '☕ Pause']].map(([k, l]) => `<button type="button" data-t="${k}" class="${d.type === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="c12 only-learn"><label class="f">Prüfung</label><select id="bSubj">${subjOptions(d.subjectId)}</select></div>
    <div class="c12 only-fixed"><label class="f">Bezeichnung</label><input type="text" id="bTitle" value="${esc(d.title)}" placeholder="z. B. Uni, Arbeit, Mittagspause" maxlength="60"></div>
    <div class="c12"><label class="f">Thema / Notiz (optional)</label><input type="text" id="bTopic" value="${esc(d.topic)}" placeholder="z. B. Marktformen, Klimazonen" maxlength="100"></div>
    <div class="c4"><label class="f">${d.recurring ? 'Beginn der Serie' : 'Datum'}</label><input type="date" id="bDate" value="${d.date}"></div>
    <div class="c4"><label class="f">Beginn</label><input type="time" id="bStart" value="${minToTime(d.start)}" step="900"></div>
    <div class="c4"><label class="f">Dauer (Minuten)</label><input type="number" id="bDur" value="${d.duration}" min="15" step="15"></div>
    <div class="c12"><label class="switch"><input type="checkbox" id="bRec" ${d.recurring ? 'checked' : ''}><span class="sl"></span><span>Wöchentlich wiederholen <span class="muted small" id="bRecInfo"></span></span></label></div>
    <div class="c6" id="bUntilWrap"><label class="f">Wiederholen bis (optional)</label><input type="date" id="bUntil" value="${d.until || ''}"></div>
  </div>`;
  const actions = [];
  if (!isNew) actions.push({ label: '🗑 Löschen', cls: 'danger', onClick: (r, close) => { close(); deleteBlockFlow(b, ctx.date); return false; } });
  if (!isNew && b.type === 'learn' && ctx.date <= todayKey()) actions.push({ label: isDone(b.id + '|' + ctx.date) ? 'Haken entfernen' : '✓ Erledigt', cls: '', onClick: () => { toggleDone(b.id, ctx.date); } });
  actions.push({ label: 'Abbrechen' });
  actions.push({ label: isNew ? 'Anlegen' : 'Speichern', cls: 'primary', onClick: r => {
    const type = $('#bType .on', r).dataset.t;
    const nb = {
      type, subjectId: type === 'learn' ? $('#bSubj', r).value : null,
      title: type !== 'learn' ? $('#bTitle', r).value.trim() : '',
      topic: $('#bTopic', r).value.trim(), date: $('#bDate', r).value,
      start: timeToMin($('#bStart', r).value), duration: Math.round(num($('#bDur', r).value)),
      recurring: $('#bRec', r).checked, until: $('#bRec', r).checked ? $('#bUntil', r).value : ''
    };
    if (!nb.date) { toast('Bitte ein Datum wählen.'); return false; }
    if (nb.duration < 5) { toast('Bitte eine Dauer von mind. 5 Minuten.'); return false; }
    if (nb.start < P_START * 60 || nb.start + nb.duration > P_END * 60 + 60) { toast(`Bitte zwischen ${P_START}:00 und ${P_END}:00 Uhr planen.`); return false; }
    if (nb.until && nb.until < nb.date) { toast('„Bis“-Datum liegt vor dem Beginn.'); return false; }
    if (type === 'learn') lastSubj = nb.subjectId;
    if (isNew) state.plan.blocks.push(Object.assign({ id: uid(), exceptions: [] }, nb));
    else Object.assign(b, nb);
    save(); renderPlan();
    toast(isNew ? 'Block angelegt' : 'Block gespeichert');
  } });
  openModal({ title: isNew ? 'Neuer Block' : (d.recurring ? 'Wiederkehrenden Block bearbeiten' : 'Block bearbeiten'), body, actions, onMount: r => {
    const upd = () => {
      const type = $('#bType .on', r).dataset.t;
      $$('.only-learn', r).forEach(x => x.style.display = type === 'learn' ? '' : 'none');
      $$('.only-fixed', r).forEach(x => x.style.display = type !== 'learn' ? '' : 'none');
      $('#bUntilWrap', r).style.display = $('#bRec', r).checked ? '' : 'none';
      const dv = $('#bDate', r).value;
      $('#bRecInfo', r).textContent = dv ? `(jeden ${WD_LONG[wdIdx(dv)]})` : '';
    };
    $$('#bType button', r).forEach(x => x.onclick = () => { $$('#bType button', r).forEach(y => y.classList.remove('on')); x.classList.add('on'); upd(); });
    $('#bRec', r).onchange = upd; $('#bDate', r).onchange = upd; upd();
  } });
}

function deleteBlockFlow(b, date) {
  const doDel = () => {
    Object.keys(state.plan.done).forEach(k => { if (k.startsWith(b.id + '|')) delete state.plan.done[k]; });
    state.plan.blocks = state.plan.blocks.filter(x => x.id !== b.id);
    save(); renderPlan(); toast('Block gelöscht (bereits erfasste Lernzeit bleibt erhalten)');
  };
  if (!b.recurring) { doDel(); return; }
  openModal({ title: 'Wiederkehrenden Block löschen', body: `<p>Was möchtest du löschen?</p>`, actions: [
    { label: `Nur am ${fmtDateShort(date)}`, onClick: () => { b.exceptions.push(date); save(); renderPlan(); toast('Termin an diesem Tag entfernt'); } },
    { label: `Ab ${fmtDateShort(date)} beenden`, onClick: () => { if (date <= b.date) doDel(); else { b.until = addDays(date, -1); save(); renderPlan(); toast('Serie beendet'); } } },
    { label: 'Ganze Serie', cls: 'danger solid', onClick: doDel }
  ] });
}

/* =========================================================
   Ansicht: Meine Ziele
   ========================================================= */
function emptyGoal() { return { dailyMode: 'uniform', uniform: 0, perDay: [0, 0, 0, 0, 0, 0, 0], weeklyMode: 'auto', weeklyManual: 0, perSubject: {} }; }
function hmInputs(id, min) {
  return `<div class="dur"><input type="number" min="0" max="23" id="${id}H" value="${Math.floor(min / 60)}" inputmode="numeric"> h <input type="number" min="0" max="59" step="5" id="${id}M" value="${min % 60}" inputmode="numeric"> min</div>`;
}
const readHM = (r, id) => Math.round(num($(`#${id}H`, r).value) * 60 + num($(`#${id}M`, r).value));
function goalSummary(g) {
  const d = g.dailyMode === 'perDay' ? g.perDay.map((m, i) => `${WD[i]} ${m ? fmtH(m) : '–'}`).join(', ') : `täglich ${fmtDur(g.uniform)}`;
  const w = g.weeklyMode === 'manual' ? `Woche ${fmtH(g.weeklyManual)} (manuell)` : `Woche ${fmtH(goalSum(g))} (automatisch)`;
  return `${d} · ${w}`;
}

function renderGoals() {
  const t = todayKey(), A = agg();
  const g = ui.goalDraft || JSON.parse(JSON.stringify(goalAt(t) || emptyGoal()));
  ui.goalDraft = g;
  const s = streaks(A), c = badgeCtx(A);
  const hist = state.goalHistory.slice().reverse();
  const rlog = [...Object.entries(state.rewardLog.day).map(([k, v]) => ({ k, v, t: 'Tag' })), ...Object.entries(state.rewardLog.week).map(([k, v]) => ({ k, v, t: 'Woche' }))]
    .sort((a, b) => (b.v.at || 0) - (a.v.at || 0)).slice(0, 8);

  $('#view-goals').innerHTML = `
  <div class="view-head"><h1>Meine Ziele</h1><span class="muted small">Änderungen gelten ab heute – vergangene Tage behalten ihr damaliges Ziel.</span></div>
  <div class="grid g2 mb">
    <div class="card"><div class="card-head"><h2>☀️ Tagesziel</h2>
      <div class="seg" id="dMode"><button data-m="uniform" class="${g.dailyMode === 'uniform' ? 'on' : ''}">Einheitlich</button><button data-m="perDay" class="${g.dailyMode === 'perDay' ? 'on' : ''}">Je Wochentag</button></div></div>
      ${g.dailyMode === 'uniform'
        ? `<label class="f">Jeden Tag</label>${hmInputs('gU', g.uniform)}`
        : `<div class="stack">${WD_LONG.map((n, i) => `<div class="row between"><span style="min-width:90px;font-weight:600">${n}</span>${hmInputs('gD' + i, g.perDay[i])}<span class="tiny muted" style="min-width:60px">${g.perDay[i] ? '' : '😌 Ruhetag'}</span></div>`).join('')}</div>
           <div class="row" style="margin-top:10px"><button class="chip" id="copyMoFr">Mo-Wert für Mo–Fr übernehmen</button></div>`}
      <p class="muted small">Tage mit 0 h gelten als Ruhetag und unterbrechen deine Serie nicht.</p>
    </div>
    <div class="card"><div class="card-head"><h2>📅 Wochenziel</h2></div>
      <label class="switch mb"><input type="checkbox" id="wAuto" ${g.weeklyMode === 'auto' ? 'checked' : ''}><span class="sl"></span><span>Automatisch als Summe der Tagesziele</span></label>
      ${g.weeklyMode === 'auto'
        ? `<div class="big-num" id="wSum">${fmtH(goalSum(g))}</div><div class="muted small">pro Woche (Summe aus Mo–So)</div>`
        : `<label class="f">Stunden pro Woche</label><div class="dur"><input type="number" id="wMan" min="0" max="168" step="0.5" value="${+(g.weeklyManual / 60).toFixed(2)}" inputmode="decimal"> h</div>
           <div class="muted small" style="margin-top:6px">Zum Vergleich: Summe deiner Tagesziele = ${fmtH(goalSum(g))}</div>`}
      <h3 style="margin-top:18px">Optional: Wochenziel je Prüfung</h3>
      <div class="stack" style="margin-top:8px">${state.subjects.map(x => `<div class="row between"><span class="nowrap"><span class="dot" style="background:${x.color}"></span> ${esc(x.short)}</span>
        <div class="dur"><input type="number" data-ps="${x.id}" min="0" max="80" step="0.5" value="${g.perSubject?.[x.id] ? +(g.perSubject[x.id] / 60).toFixed(2) : ''}" placeholder="–" inputmode="decimal"> h/Woche</div></div>`).join('')}</div>
      ${(() => { const ps = Object.values(g.perSubject || {}).reduce((a, b) => a + b, 0); const wk = g.weeklyMode === 'auto' ? goalSum(g) : g.weeklyManual; return ps > wk && wk ? `<div class="hint" style="margin-top:10px"><span class="hi">ℹ️</span><div>Die Summe der Prüfungsziele (${fmtH(ps)}) ist größer als dein Wochenziel (${fmtH(wk)}).</div></div>` : ''; })()}
    </div>
  </div>
  <div class="row mb" style="justify-content:flex-end;gap:8px"><button class="btn" id="goalReset">Zurücksetzen</button><button class="btn primary" id="goalSave">💾 Ziele speichern (gelten ab heute)</button></div>

  <div class="grid g2 mb">
    ${rewardListHTML('daily', '🍦 Tagesbelohnungen', 'z. B. Folge meiner Serie')}
    ${rewardListHTML('weekly', '🎁 Wochenbelohnungen', 'z. B. Essen gehen')}
  </div>

  <div class="card mb"><div class="card-head"><h2>🔥 Serien & Erfolge</h2></div>
    <div class="grid g4 mb" style="gap:10px">
      <div><div class="stat-label">Tage in Folge</div><div class="big-num">${s.day}</div><div class="muted small">Rekord ${s.dayBest}</div></div>
      <div><div class="stat-label">Wochen in Folge</div><div class="big-num">${s.week}</div><div class="muted small">Rekord ${s.weekBest}</div></div>
      <div><div class="stat-label">Tagesziele erreicht</div><div class="big-num">${s.daysMet}</div></div>
      <div><div class="stat-label">Wochenziele erreicht</div><div class="big-num">${s.weeksMet}</div></div>
    </div>
    <h3 class="mb">Abzeichen (${BADGES.filter(b => state.badges[b.id]).length}/${BADGES.length})</h3>
    <div class="badges">${BADGES.map(b => { const e = state.badges[b.id], p = clamp(b.p(c), 0, 1);
      return `<div class="badge ${e ? 'earned' : 'locked'}" title="${esc(b.desc)}"><span class="bi">${b.icon}</span><span class="bn">${esc(b.name)}</span><span class="bd">${e ? 'erreicht am ' + fmtDateShort(e) : esc(b.desc)}</span>${e ? '' : pbar(p, 'var(--accent)')}</div>`; }).join('')}</div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>Verlauf der Ziele</h2></div>
      ${hist.length ? `<ul class="list">${hist.map((h, i) => `<li><div class="entry-main"><div class="t">ab ${fmtDate(h.from)} ${i === 0 ? '<span class="tag" style="background:var(--ok-soft);color:var(--ok)">aktuell</span>' : ''}</div><div class="s">${esc(goalSummary(h))}</div></div></li>`).join('')}</ul>` : '<div class="empty small">Noch keine Ziele gespeichert.</div>'}</div>
    <div class="card"><div class="card-head"><h2>Zuletzt gewonnene Belohnungen</h2></div>
      ${rlog.length ? `<ul class="list">${rlog.map(r => `<li><span>${r.t === 'Woche' ? '🏆' : '🎉'}</span><div class="entry-main"><div class="t">${esc(r.v.reward || '(keine Belohnung hinterlegt)')}</div><div class="s">${r.t === 'Woche' ? 'Wochenziel KW ' + isoWeek(r.k) : 'Tagesziel ' + fmtDate(r.k)}</div></div></li>`).join('')}</ul>` : '<div class="empty small">Erreiche dein Tagesziel, um die erste Belohnung zu ziehen!</div>'}</div>
  </div>`;

  const v = $('#view-goals');
  const readDraft = () => {
    if (g.dailyMode === 'uniform') g.uniform = readHM(v, 'gU');
    else for (let i = 0; i < 7; i++) g.perDay[i] = readHM(v, 'gD' + i);
    if (g.weeklyMode === 'manual' && $('#wMan', v)) g.weeklyManual = Math.round(num($('#wMan', v).value) * 60);
    g.perSubject = {};
    $$('[data-ps]', v).forEach(i => { const m = Math.round(num(i.value) * 60); if (m > 0) g.perSubject[i.dataset.ps] = m; });
  };
  $$('#dMode button', v).forEach(b => b.onclick = () => {
    readDraft();
    if (b.dataset.m === 'perDay' && g.dailyMode === 'uniform') g.perDay = g.perDay.some(x => x) ? g.perDay : Array(7).fill(g.uniform);
    if (b.dataset.m === 'uniform' && g.dailyMode === 'perDay') g.uniform = g.uniform || g.perDay[0];
    g.dailyMode = b.dataset.m; renderGoals();
  });
  $('#wAuto', v).onchange = ev => { readDraft(); g.weeklyMode = ev.target.checked ? 'auto' : 'manual'; if (g.weeklyMode === 'manual' && !g.weeklyManual) g.weeklyManual = goalSum(g); renderGoals(); };
  $$('input[id^=gU],input[id^=gD]', v).forEach(i => i.addEventListener('input', () => { readDraft(); const ws = $('#wSum', v); if (ws) ws.textContent = fmtH(goalSum(g)); }));
  $('#copyMoFr', v) && ($('#copyMoFr', v).onclick = () => { readDraft(); for (let i = 1; i < 5; i++) g.perDay[i] = g.perDay[0]; renderGoals(); });
  $('#goalReset', v).onclick = () => { ui.goalDraft = null; renderGoals(); };
  $('#goalSave', v).onclick = () => {
    readDraft();
    const sum = goalSum(g), wk = g.weeklyMode === 'auto' ? sum : g.weeklyManual;
    if (sum <= 0 && wk <= 0) { toast('Bitte ein Tages- oder Wochenziel größer 0 eingeben.'); return; }
    setGoal(JSON.parse(JSON.stringify(g)));
    ui.goalDraft = null;
    toast('🎯 Ziele gespeichert – gültig ab heute');
    renderGoals(); checkRewards();
  };
  bindRewardLists(v);
}

function rewardListHTML(kind, title, ph) {
  const list = state.rewards[kind];
  return `<div class="card"><div class="card-head"><h2>${title}</h2><span class="muted small">${list.length} Einträge</span></div>
    <form class="row mb" data-rform="${kind}" style="flex-wrap:nowrap"><input type="text" placeholder="${ph}" maxlength="80" data-rinput="${kind}"><button class="btn primary" type="submit">＋</button></form>
    ${list.length ? `<ul class="list">${list.map((r, i) => `<li><span>${kind === 'daily' ? '🍦' : '🎁'}</span><div class="entry-main">${esc(r)}</div><button class="btn sm ghost" data-rdel="${kind}" data-i="${i}" title="Entfernen">✕</button></li>`).join('')}</ul>`
      : '<div class="empty small">Noch leer – füge deine Belohnungen hinzu.</div>'}
    <p class="muted small" style="margin-bottom:0">${kind === 'daily' ? 'Beim Erreichen des Tagesziels zieht die App zufällig eine davon.' : 'Beim Erreichen des Wochenziels wird eine davon gezogen.'}</p></div>`;
}
function bindRewardLists(v) {
  $$('[data-rform]', v).forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const k = f.dataset.rform, inp = $(`[data-rinput="${k}"]`, f), val = inp.value.trim();
    if (!val) return;
    state.rewards[k].push(val); save(); renderGoals();
    setTimeout(() => $(`[data-rinput="${k}"]`)?.focus(), 0);
  });
  $$('[data-rdel]', v).forEach(b => b.onclick = () => { state.rewards[b.dataset.rdel].splice(+b.dataset.i, 1); save(); renderGoals(); });
}

/* =========================================================
   Ansicht: Einstellungen
   ========================================================= */
function renderSettings() {
  const A = agg();
  const le = state.settings.lastExport;
  $('#view-settings').innerHTML = `
  <div class="view-head"><h1>Einstellungen</h1></div>
  <div class="card mb"><div class="card-head"><h2>📘 Prüfungen</h2><button class="btn sm primary" id="addSubj">＋ Prüfung</button></div>
    <div class="subj-row head"><span>Farbe</span><span>Name</span><span>Kürzel</span><span>Fach</span><span>Prüfungsdatum</span><span>Ziel (h)</span><span></span></div>
    ${state.subjects.map(x => `<div class="subj-row" data-sid="${x.id}">
      <input type="color" value="${x.color}" data-f="color" title="Farbe">
      <div class="name"><span class="lbl">Name</span><input type="text" value="${esc(x.name)}" data-f="name" maxlength="60"></div>
      <div><span class="lbl">Kürzel</span><input type="text" value="${esc(x.short)}" data-f="short" maxlength="10"></div>
      <div><span class="lbl">Fach</span><select data-f="group">${state.groups.map(g => `<option value="${g.id}" ${g.id === x.group ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>
      <div><span class="lbl">Prüfungsdatum</span><input type="date" value="${x.examDate || ''}" data-f="examDate"></div>
      <div><span class="lbl">Zielstunden</span><input type="number" min="0" step="5" value="${x.targetHours || ''}" placeholder="–" data-f="targetHours" inputmode="numeric"></div>
      <button class="btn sm ghost" data-sdel="${x.id}" title="Prüfung löschen">🗑</button>
    </div>`).join('')}
    <p class="muted small">Änderungen werden sofort gespeichert. Zielstunden = wie viele Stunden du insgesamt pro Prüfung lernen möchtest.</p>
  </div>
  <div class="grid g2 mb">
    <div class="card"><div class="card-head"><h2>🗂️ Fächer</h2><button class="btn sm" id="addGroup">＋ Fach</button></div>
      ${state.groups.map(g => `<div class="row" style="flex-wrap:nowrap;margin-bottom:8px" data-gid="${g.id}"><input type="color" value="${g.color}" data-g="color"><input type="text" value="${esc(g.name)}" data-g="name" maxlength="40">
        <span class="muted small nowrap">${state.subjects.filter(s => s.group === g.id).length} Prüf.</span><button class="btn sm ghost" data-gdel="${g.id}" title="Fach löschen">🗑</button></div>`).join('')}
    </div>
    <div class="card"><div class="card-head"><h2>🎨 Darstellung</h2></div>
      <div class="seg" id="themeSeg">${[['auto', '🖥️ System'], ['light', '☀️ Hell'], ['dark', '🌙 Dunkel']].map(([k, l]) => `<button data-th="${k}" class="${state.settings.theme === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
  </div>
  <div class="card mb"><div class="card-head"><h2>💾 Datensicherung</h2></div>
    <p style="margin-top:0">Deine Daten liegen nur in <b>diesem Browser</b> auf diesem Gerät. Exportiere regelmäßig eine Sicherung (z. B. in deine Cloud), um nichts zu verlieren oder um die Daten auf ein anderes Gerät zu übertragen.</p>
    <div class="row"><button class="btn primary" data-act="export">⬇️ Daten exportieren (JSON)</button><button class="btn" id="importBtn">⬆️ Sicherung importieren</button></div>
    <p class="muted small">Letzte Sicherung: ${le ? new Date(le).toLocaleString('de-DE') : 'noch nie'} · ${state.entries.length} Einträge · ${fmtH(A.total)} · ${state.plan.blocks.length} Planblöcke</p>
  </div>
  <div class="card"><div class="card-head"><h2>⚠️ Gefahrenzone</h2></div>
    <button class="btn danger" id="resetAll">Alle Daten löschen</button>
  </div>`;

  const v = $('#view-settings');
  $$('.subj-row[data-sid]', v).forEach(row => {
    const x = subj(row.dataset.sid);
    $$('[data-f]', row).forEach(inp => inp.addEventListener('change', () => {
      const f = inp.dataset.f;
      let val = inp.value;
      if (f === 'targetHours') val = Math.max(0, num(val));
      if ((f === 'name' || f === 'short') && !val.trim()) { inp.value = x[f]; return; }
      x[f] = typeof val === 'string' ? val.trim() : val;
      save(); toast('Gespeichert');
    }));
  });
  $('#addSubj', v).onclick = () => {
    const cols = ['#0d9488', '#be123c', '#4338ca', '#65a30d', '#c2410c', '#0369a1'];
    state.subjects.push({ id: uid(), name: 'Neue Prüfung', short: 'Neu', group: state.groups[0].id, color: cols[state.subjects.length % cols.length], examDate: '', targetHours: 0 });
    save(); renderSettings();
    $$('.subj-row[data-sid] [data-f=name]', v).pop()?.select();
  };
  $$('[data-sdel]', v).forEach(b => b.onclick = async () => {
    const x = subj(b.dataset.sdel), n = state.entries.filter(e => e.subjectId === x.id).length;
    if (state.subjects.length <= 1) { toast('Mindestens eine Prüfung wird benötigt.'); return; }
    if (!await askConfirm(`„${esc(x.name)}“ löschen?${n ? ` <b>${n} Lerneinträge</b> und zugehörige Planblöcke werden ebenfalls gelöscht.` : ''}`, 'Löschen', true)) return;
    state.subjects = state.subjects.filter(s => s.id !== x.id);
    state.entries = state.entries.filter(e => e.subjectId !== x.id);
    state.plan.blocks = state.plan.blocks.filter(bl => bl.subjectId !== x.id);
    state.goalHistory.forEach(g => { if (g.perSubject) delete g.perSubject[x.id]; });
    save(); renderSettings(); toast('Prüfung gelöscht');
  });
  $$('[data-gid]', v).forEach(row => {
    const g = group(row.dataset.gid);
    $$('[data-g]', row).forEach(inp => inp.addEventListener('change', () => { if (inp.dataset.g === 'name' && !inp.value.trim()) { inp.value = g.name; return; } g[inp.dataset.g] = inp.value.trim(); save(); renderSettings(); toast('Gespeichert'); }));
  });
  $('#addGroup', v).onclick = () => { state.groups.push({ id: uid(), name: 'Neues Fach', color: '#64748b' }); save(); renderSettings(); };
  $$('[data-gdel]', v).forEach(b => b.onclick = () => {
    if (state.subjects.some(s => s.group === b.dataset.gdel)) { toast('Ordne zuerst alle Prüfungen einem anderen Fach zu.'); return; }
    if (state.groups.length <= 1) { toast('Mindestens ein Fach wird benötigt.'); return; }
    state.groups = state.groups.filter(g => g.id !== b.dataset.gdel); save(); renderSettings();
  });
  $$('#themeSeg button', v).forEach(b => b.onclick = () => { state.settings.theme = b.dataset.th; save(); applyTheme(); renderSettings(); });
  $('#importBtn', v).onclick = () => $('#importFile').click();
  $('#resetAll', v).onclick = async () => {
    if (!await askConfirm('Wirklich <b>alle</b> Daten (Einträge, Ziele, Plan, Belohnungen) löschen? Das kann nicht rückgängig gemacht werden. Exportiere vorher eine Sicherung!', 'Alles löschen', true)) return;
    state = defaultState(); save(); toast('Alle Daten gelöscht'); go('dash'); onboarding();
  };
}

/* ---------- Export / Import ---------- */
function exportData() {
  state.settings.lastExport = new Date().toISOString();
  save();
  const data = { app: 'lernplaner-staatsexamen', exportedAt: state.settings.lastExport, data: state };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lernplaner-sicherung-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('💾 Sicherung heruntergeladen');
  renderCurrent();
}
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const d = obj && obj.data ? obj.data : obj;
    if (!d || !Array.isArray(d.subjects) || !Array.isArray(d.entries)) throw new Error('Format');
    const n = migrate(d);
    if (!await askConfirm(`Sicherung vom ${obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('de-DE') : 'unbekannten Datum'} mit <b>${n.entries.length} Einträgen</b> und ${n.plan.blocks.length} Planblöcken importieren?<br><br>Deine aktuellen Daten in diesem Browser werden dabei <b>ersetzt</b>.`, 'Importieren')) return;
    state = n; save(); applyTheme(); updateChip();
    toast('✅ Sicherung importiert');
    renderCurrent();
  } catch (e) {
    console.error(e);
    toast('❌ Die Datei ist keine gültige Lernplaner-Sicherung.');
  }
});

/* =========================================================
   Onboarding (erster Start)
   ========================================================= */
function onboarding() {
  if (state.goalHistory.length) return;
  const body = `<p style="margin-top:0">Willkommen zu deinem Lernplaner für das <b>1. Staatsexamen</b>! 🎓<br>Lege zuerst fest, wie viel du lernen möchtest. Du kannst das später jederzeit unter „Meine Ziele“ ändern (z. B. je Wochentag unterschiedlich).</p>
    <div class="form-grid">
      <div class="c12"><label class="f">Tagesziel</label>${hmInputs('obD', 0)}</div>
      <div class="c12"><label class="switch"><input type="checkbox" id="obRest"><span class="sl"></span><span>Sonntag ist Ruhetag (0 h)</span></label></div>
      <div class="c12"><label class="switch"><input type="checkbox" id="obAuto" checked><span class="sl"></span><span>Wochenziel automatisch berechnen <b id="obSum"></b></span></label></div>
      <div class="c12" id="obManWrap" style="display:none"><label class="f">Wochenziel</label><div class="dur"><input type="number" id="obW" min="0" step="0.5" inputmode="decimal"> h pro Woche</div></div>
    </div>`;
  openModal({ title: '🎯 Deine Lernziele', body, locked: true, actions: [{ label: 'Los geht’s!', cls: 'primary', onClick: r => {
    const d = readHM(r, 'obD'), rest = $('#obRest', r).checked, auto = $('#obAuto', r).checked;
    const w = Math.round(num($('#obW', r).value) * 60);
    if (d <= 0) { toast('Bitte ein Tagesziel größer 0 eingeben.'); return false; }
    if (!auto && w <= 0) { toast('Bitte ein Wochenziel eingeben oder automatisch berechnen lassen.'); return false; }
    const g = emptyGoal();
    if (rest) { g.dailyMode = 'perDay'; g.perDay = [d, d, d, d, d, d, 0]; } else g.uniform = d;
    g.weeklyMode = auto ? 'auto' : 'manual'; g.weeklyManual = w;
    setGoal(g); toast('🎯 Ziele gespeichert – viel Erfolg!');
    renderCurrent(); checkRewards();
  } }], onMount: r => {
    const upd = () => {
      const d = readHM(r, 'obD'), rest = $('#obRest', r).checked;
      $('#obSum', r).textContent = d ? `(= ${fmtH(d * (rest ? 6 : 7))})` : '';
      $('#obManWrap', r).style.display = $('#obAuto', r).checked ? 'none' : '';
    };
    $$('input', r).forEach(i => i.addEventListener('input', upd)); $$('input[type=checkbox]', r).forEach(i => i.addEventListener('change', upd)); upd();
  } });
}

/* =========================================================
   Navigation, Theme, Start
   ========================================================= */
const RENDER = { dash: renderDash, log: renderLog, plan: renderPlan, goals: renderGoals, settings: renderSettings };
function go(view) {
  if (!RENDER[view]) view = 'dash';
  ui.view = view; saveUi();
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view !== 'goals') ui.goalDraft = null;
  RENDER[view]();
  scrollTo({ top: 0 });
}
function renderCurrent() { RENDER[ui.view](); }

function applyTheme() {
  const th = state.settings.theme;
  const dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.settings.theme === 'auto') { applyTheme(); renderCurrent(); } });
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  state.settings.theme = dark ? 'light' : 'dark'; save(); applyTheme(); renderCurrent();
};
$('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button[data-view]'); if (b) go(b.dataset.view); });
$('#timerChip').onclick = () => go('log');

// globale Klick-Delegation für Links/Buttons in Ansichten
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go); return; }
  const a = ev.target.closest('[data-act="export"]');
  if (a) { ev.preventDefault(); exportData(); return; }
  const dw = ev.target.closest('[data-dw]');
  if (dw) { const d = +dw.dataset.dw, cur = mondayOf(todayKey()); ui.dashWeek = d === 0 ? null : addDays(ui.dashWeek || cur, d * 7); if (ui.dashWeek === cur) ui.dashWeek = null; renderDash(); return; }
  const dn = ev.target.closest('[data-done]');
  if (dn && dn.closest('#view-dash')) { toggleDone(dn.dataset.bid, dn.dataset.date); }
});

// Tageswechsel erkennen (App bleibt über Mitternacht offen)
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); renderCurrent(); } }, 60000);
// Daten in anderem Tab geändert
addEventListener('storage', ev => { if (ev.key === STORE_KEY) { state = load(); renderCurrent(); updateChip(); } });

applyTheme();
go(ui.view || 'dash');
updateChip();
checkBadges(true);
onboarding();
</script>
</body>
</html>
