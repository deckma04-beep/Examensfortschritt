<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernplaner Staatsexamen</title>
<meta name="theme-color" content="#4f46e5">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f0f1f5; --text:#1d2130; --muted:#6b7280;
  --border:#e3e5ea; --accent:#4f46e5; --accent-soft:#eef0ff; --ok:#16a34a; --ok-soft:#dcfce7;
  --warn:#d97706; --warn-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
  --heat0:#e9ebf0; --heat1:#c7d2fe; --heat2:#a5b4fc; --heat3:#6366f1; --heat4:#3730a3;
  --fixed:#9ca3af; --radius:14px;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0e1016; --surface:#171a22; --surface2:#1f232d; --text:#e6e8ee; --muted:#9aa1ad;
  --border:#2a2f3b; --accent:#8b8cf8; --accent-soft:#25264a; --ok:#4ade80; --ok-soft:#163222;
  --warn:#fbbf24; --warn-soft:#3a2e12; --danger:#f87171; --danger-soft:#3b1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --heat0:#232733; --heat1:#2f3470; --heat2:#4146a8; --heat3:#6366f1; --heat4:#a5b4fc;
  --fixed:#5b6270;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:1.05rem;font-weight:650}
h3{font-size:.95rem;font-weight:600}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.75rem}
.nowrap{white-space:nowrap}

/* Header & Navigation */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:6px}
nav.tabs button:hover{background:var(--surface2);color:var(--text)}
nav.tabs button.active{background:var(--accent-soft);color:var(--accent)}
nav.tabs .ico{font-size:1.05rem}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.timer-chip{display:none;align-items:center;gap:6px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:4px 10px;font-weight:600;font-size:.85rem;cursor:pointer;border:0}
.timer-chip.on{display:flex}
.timer-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

main{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.view{display:none}
.view.active{display:block}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-head h1{font-size:1.35rem}

/* Cards & Grid */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mb{margin-bottom:14px}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}

/* Ring */
.ring-card{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ring-bg{stroke:var(--surface2)}
.ring .ring-fg{transition:stroke-dashoffset .8s ease}
.ring .ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ring-label b{font-size:1.35rem;display:block;line-height:1.1}
.ring .ring-label span{font-size:.72rem;color:var(--muted)}
.big-num{font-size:2rem;font-weight:750;line-height:1.1}
.stat-label{color:var(--muted);font-size:.82rem;font-weight:550;text-transform:uppercase;letter-spacing:.04em}

/* Buttons & forms */
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:60px}
input[type=color]{width:38px;height:34px;border:1px solid var(--border);border-radius:8px;background:none;padding:2px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c8{grid-column:span 8}
.dur{display:flex;gap:6px;align-items:center}
.dur input{width:72px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .sl{width:42px;height:24px;border-radius:999px;background:var(--border);position:relative;transition:.2s;flex:none}
.switch .sl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.sl{background:var(--accent)}
.switch input:checked+.sl::after{left:21px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface2)}
.entry-main{flex:1;min-width:0}
.entry-main .t{font-weight:600}
.entry-main .s{color:var(--muted);font-size:.83rem;overflow:hidden;text-overflow:ellipsis}
.day-head{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty .e{font-size:2rem;display:block;margin-bottom:6px}

/* Progress bars */
.pbar{height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:999px;transition:width .6s}
.prog-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 92px;gap:10px;align-items:center;padding:6px 0}
.prog-row .n{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prog-row .v{font-size:.82rem;color:var(--muted);text-align:right;white-space:nowrap}

/* Hints */
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--text);font-size:.9rem}
.hint.info{background:var(--accent-soft)}
.hint.ok{background:var(--ok-soft)}
.hint .hi{font-size:1.1rem;line-height:1.3}

/* Countdown */
.cd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cd{border:1px solid var(--border);border-radius:12px;padding:10px 12px;border-left:4px solid var(--c)}
.cd b{font-size:1.4rem}
.cd .muted{font-size:.8rem}

/* Heatmap */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:inline-grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,13px);gap:3px}
.heat .hc{width:13px;height:13px;border-radius:3px;background:var(--heat0)}
.heat .hc.l1{background:var(--heat1)}.heat .hc.l2{background:var(--heat2)}.heat .hc.l3{background:var(--heat3)}.heat .hc.l4{background:var(--heat4)}
.heat .hc.goal{box-shadow:inset 0 0 0 2px var(--ok)}
.heat .hc.future{background:transparent;border:1px dashed var(--border)}
.heat .hc.today{outline:2px solid var(--text);outline-offset:1px}
.heat .hm{font-size:10px;color:var(--muted);white-space:nowrap;height:16px;overflow:visible}
.heat .hl{font-size:10px;color:var(--muted);height:13px;line-height:13px;padding-right:4px}
.heat-legend{display:flex;gap:4px;align-items:center;font-size:.75rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.heat-legend .hc{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Timer */
.timer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.timer-btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;border-left:4px solid var(--c);font-weight:600}
.timer-btn:hover{background:var(--surface2)}
.timer-run{border-radius:14px;padding:18px;background:var(--ok-soft);text-align:center}
.timer-run .clock{font-size:2.6rem;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* Planner */
.planner-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.planner{display:grid;grid-template-columns:48px repeat(7,minmax(92px,1fr));min-width:720px;position:relative}
.planner .ph{position:sticky;top:0;background:var(--surface);z-index:3;padding:8px 4px;text-align:center;border-bottom:1px solid var(--border);font-size:.82rem;font-weight:650}
.planner .ph.today{color:var(--accent)}
.planner .ph small{display:block;color:var(--muted);font-weight:500}
.planner .ph .sum{font-size:.7rem;color:var(--muted);font-weight:500}
.ptimes{position:relative}
.ptimes div{position:absolute;right:6px;font-size:.7rem;color:var(--muted);transform:translateY(-50%)}
.pday{position:relative;border-left:1px solid var(--border);cursor:copy;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hpx) - 1px),var(--border) calc(var(--hpx) - 1px),var(--border) var(--hpx))}
.pday.today{background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.pblock{position:absolute;border-radius:8px;padding:3px 6px;font-size:.74rem;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--text);box-shadow:var(--shadow);user-select:none;z-index:2}
.pblock.fixed{--c:var(--fixed);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--fixed) 22%,var(--surface)) 0 6px,color-mix(in srgb,var(--fixed) 12%,var(--surface)) 6px 12px)}
.pblock.dragging{opacity:.85;cursor:grabbing;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pblock.done{opacity:.6}
.pblock.done .pb-t{text-decoration:line-through}
.pblock .pb-time{font-weight:600;color:var(--muted);font-size:.68rem}
.pblock .pb-t{font-weight:650}
.pblock .pb-check{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--c);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:12px;color:#fff;padding:0}
.pblock.done .pb-check{background:var(--ok);border-color:var(--ok)}
.pblock .rec{font-size:.65rem}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
table.cmp th,table.cmp td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp th{font-size:.78rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.03em}
table.cmp tr.total td{font-weight:700;border-bottom:0}
.tbl-wrap{overflow-x:auto}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;background:var(--surface)}
.badge .bi{font-size:1.9rem;display:block;line-height:1.2}
.badge .bn{font-weight:650;font-size:.86rem;display:block;margin-top:4px}
.badge .bd{font-size:.73rem;color:var(--muted);display:block}
.badge.locked .bi{filter:grayscale(1);opacity:.35}
.badge.locked{background:var(--surface2)}
.badge.earned{border-color:color-mix(in srgb,var(--ok) 50%,var(--border));box-shadow:0 0 0 3px var(--ok-soft)}
.badge .pbar{margin-top:8px;height:5px}

/* Settings table */
.subj-row{display:grid;grid-template-columns:40px minmax(140px,2fr) 90px 130px 150px 90px 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.subj-row.head{font-size:.75rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.03em;padding-top:0}
.subj-row .lbl{display:none}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:680px}
.modal .mh{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mh h2{font-size:1.12rem}
.modal .mb2{padding:14px 18px}
.modal .mf{padding:0 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.celebrate{text-align:center}
.celebrate .ce{font-size:3.4rem;display:block;animation:bounce 1s ease infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) scale(1.06)}}
.reward-box{margin:14px auto 4px;padding:14px;border-radius:12px;background:var(--accent-soft);border:2px dashed var(--accent);font-weight:700;font-size:1.1rem}

/* Toast */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s;font-size:.92rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:150}

/* Responsive */
@media (max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--surface);border-top:1px solid var(--border);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  nav.tabs button{flex-direction:column;gap:1px;font-size:.68rem;padding:4px 6px}
  nav.tabs .ico{font-size:1.25rem}
  main{padding-bottom:96px}
  .top-inner .spacer{margin-left:auto}
  .g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .c6,.c4,.c3,.c8{grid-column:span 12}
  .ring{width:100px;height:100px}
  .ring svg{width:100px;height:100px}
  .subj-row{grid-template-columns:40px 1fr 1fr;row-gap:6px}
  .subj-row.head{display:none}
  .subj-row .name{grid-column:span 2}
  .subj-row .lbl{display:block;font-size:.7rem;color:var(--muted)}
  .prog-row{grid-template-columns:90px 1fr 80px}
  #toasts{bottom:84px}
}
@media (min-width:761px){ .top-inner .spacer{display:none} }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><div class="logo">🎓</div><div>Lernplaner<small>1. Staatsexamen · Realschule</small></div></div>
    <span class="spacer"></span>
    <nav class="tabs" id="tabs">
      <button data-view="dash"><span class="ico">📊</span><span>Übersicht</span></button>
      <button data-view="log"><span class="ico">⏱️</span><span>Erfassen</span></button>
      <button data-view="plan"><span class="ico">🗓️</span><span>Planer</span></button>
      <button data-view="goals"><span class="ico">🎯</span><span>Ziele</span></button>
      <button data-view="settings"><span class="ico">⚙️</span><span>Einstellungen</span></button>
    </nav>
    <button class="timer-chip" id="timerChip" title="Laufender Timer"><span class="dot"></span><span id="timerChipText">00:00</span></button>
    <button class="icon-btn" id="themeBtn" title="Hell-/Dunkelmodus umschalten">🌓</button>
  </div>
</header>

<main>
  <section class="view" id="view-dash"></section>
  <section class="view" id="view-log"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-goals"></section>
  <section class="view" id="view-settings"></section>
</main>
<div id="toasts"></div>
<canvas id="confetti"></canvas>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
"use strict";
/* =========================================================
   Grundlagen & Hilfsfunktionen
   ========================================================= */
const STORE_KEY = 'lernplaner-staatsexamen-v1';
const UI_KEY = 'lernplaner-ui';
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const WD_LONG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const P_START = 6, P_END = 23, HPX = 46; // Planer: 6–23 Uhr, Pixel pro Stunde

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const todayKey = () => dkey(new Date());
const wdIdx = k => (parseKey(k).getDay() + 6) % 7;
const mondayOf = k => addDays(k, -wdIdx(k));
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function fmtDur(min) {
  min = Math.round(min || 0);
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h} h ${m} min`;
  if (h) return `${h} h`;
  return `${m} min`;
}
const fmtH = (min, d = 1) => (Math.round((min || 0) / 60 * 10 ** d) / 10 ** d).toLocaleString('de-DE') + ' h';
const fmtDate = k => { const d = parseKey(k); return `${WD[wdIdx(k)]}, ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
const fmtDateShort = k => { const d = parseKey(k); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`; };
const minToTime = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const timeToMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
function isoWeek(k) {
  const d = parseKey(k);
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}

function migrate(s) {
  const d = defaultState();
  const out = Object.assign({}, d, s || {});
  out.groups = Array.isArray(out.groups) && out.groups.length ? out.groups : d.groups;
  out.subjects = Array.isArray(out.subjects) ? out.subjects.map(x => Object.assign({ examDate: '', targetHours: 0, short: x.name, color: '#64748b', group: out.groups[0].id }, x)) : d.subjects;
  out.entries = Array.isArray(out.entries) ? out.entries.filter(e => e && e.subjectId && e.date && e.minutes >= 0) : [];
  out.goalHistory = Array.isArray(out.goalHistory) ? out.goalHistory.slice().sort((a, b) => a.from.localeCompare(b.from)) : [];
  out.rewards = Object.assign({ daily: [], weekly: [] }, out.rewards || {});
  out.rewardLog = Object.assign({ day: {}, week: {} }, out.rewardLog || {});
  out.badges = out.badges || {};
  out.plan = Object.assign({ blocks: [], done: {} }, out.plan || {});
  out.plan.blocks.forEach(b => { b.exceptions = b.exceptions || []; });
  out.settings = Object.assign({}, d.settings, out.settings || {});
  return out;
}

/* ---------- Aggregation ---------- */
function agg() {
  const A = { byDate: {}, byDateSubj: {}, bySubj: {}, byGroup: {}, total: 0, lastBySubj: {} };
  for (const e of state.entries) {
    A.byDate[e.date] = (A.byDate[e.date] || 0) + e.minutes;
    (A.byDateSubj[e.date] ||= {})[e.subjectId] = (A.byDateSubj[e.date][e.subjectId] || 0) + e.minutes;
    A.bySubj[e.subjectId] = (A.bySubj[e.subjectId] || 0) + e.minutes;
    const g = subj(e.subjectId)?.group;
    if (g) A.byGroup[g] = (A.byGroup[g] || 0) + e.minutes;
    A.total += e.minutes;
    if (!A.lastBySubj[e.subjectId] || A.lastBySubj[e.subjectId] < e.date) A.lastBySubj[e.subjectId] = e.date;
  }
  return A;
}
function weekMinutes(A, mon, sid) {
  let s = 0;
  for (let i = 0; i < 7; i++) {
    const k = addDays(mon, i);
    s += sid ? (A.byDateSubj[k]?.[sid] || 0) : (A.byDate[k] || 0);
  }
  return s;
}

/* ---------- Ziele (mit Verlauf) ---------- */
function goalAt(k) {
  let g = null;
  for (const h of state.goalHistory) { if (h.from <= k) g = h; else break; }
  return g;
}
function dailyGoal(k) {
  const g = goalAt(k);
  if (!g) return 0;
  return g.dailyMode === 'perDay' ? (g.perDay[wdIdx(k)] || 0) : (g.uniform || 0);
}
function weekRef(mon) { const sun = addDays(mon, 6), t = todayKey(); return sun < t ? sun : (t > mon ? t : mon); }
function weeklyGoal(mon) {
  const g = goalAt(weekRef(mon));
  if (!g) return 0;
  if (g.weeklyMode === 'manual') return g.weeklyManual || 0;
  let s = 0;
  for (let i = 0; i < 7; i++) s += dailyGoal(addDays(mon, i));
  return s;
}
function subjWeeklyGoal(mon, sid) { const g = goalAt(weekRef(mon)); return g?.perSubject?.[sid] || 0; }
function goalSum(g) { return g.dailyMode === 'perDay' ? g.perDay.reduce((a, b) => a + b, 0) : g.uniform * 7; }

function setGoal(g) {
  const t = todayKey();
  g.from = t;
  state.goalHistory = state.goalHistory.filter(h => h.from < t);
  state.goalHistory.push(g);
  state.goalHistory.sort((a, b) => a.from.localeCompare(b.from));
  save();
}

/* ---------- Serien ---------- */
function streaks(A) {
  const f = state.goalHistory[0]?.from;
  const r = { day: 0, dayBest: 0, week: 0, weekBest: 0, daysMet: 0, weeksMet: 0 };
  if (!f) return r;
  const t = todayKey();
  // Tages-Serie (Ruhetage mit Ziel 0 werden übersprungen)
  for (let k = t; k >= f; k = addDays(k, -1)) {
    const g = dailyGoal(k);
    if (g <= 0) continue;
    if ((A.byDate[k] || 0) >= g) r.day++;
    else if (k !== t) break;
  }
  let run = 0;
  for (let k = f; k <= t; k = addDays(k, 1)) {
    const g = dailyGoal(k);
    if (g <= 0) continue;
    if ((A.byDate[k] || 0) >= g) { run++; r.daysMet++; r.dayBest = Math.max(r.dayBest, run); }
    else if (k !== t) run = 0;
  }
  r.dayBest = Math.max(r.dayBest, r.day);
  // Wochen-Serie
  const curMon = mondayOf(t), firstMon = mondayOf(f);
  for (let m = curMon; m >= firstMon; m = addDays(m, -7)) {
    const g = weeklyGoal(m);
    if (g <= 0) continue;
    if (weekMinutes(A, m) >= g) r.week++;
    else if (m !== curMon) break;
  }
  run = 0;
  for (let m = firstMon; m <= curMon; m = addDays(m, 7)) {
    const g = weeklyGoal(m);
    if (g <= 0) continue;
    if (weekMinutes(A, m) >= g) { run++; r.weeksMet++; r.weekBest = Math.max(r.weekBest, run); }
    else if (m !== curMon) run = 0;
  }
  r.weekBest = Math.max(r.weekBest, r.week);
  return r;
}

function checkRewards() {
  const t = todayKey(), A = agg();
  const g = dailyGoal(t), m = A.byDate[t] || 0;
  const mon = mondayOf(t), wg = weeklyGoal(mon), wm = weekMinutes(A, mon);
  const dayHit = g > 0 && m >= g && !state.rewardLog.day[t];
  const weekHit = wg > 0 && wm >= wg && !state.rewardLog.week[mon];
  let dayReward = null, weekReward = null;
  if (dayHit) { dayReward = state.rewards.daily.length ? pick(state.rewards.daily) : null; state.rewardLog.day[t] = { reward: dayReward, at: Date.now() }; }
  if (weekHit) { weekReward = state.rewards.weekly.length ? pick(state.rewards.weekly) : null; state.rewardLog.week[mon] = { reward: weekReward, at: Date.now() }; }
  if (dayHit || weekHit) { save(); celebrate(dayHit, dayReward, weekHit, weekReward); }
  checkBadges(false);
}

/* =========================================================

function toast(msg, ms = 2800) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  const box = $('#toasts');
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
}

function openModal({ title, body, actions = [], locked = false, wide = false, onMount }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    ${title || !locked ? `<div class="mh"><h2>${esc(title || '')}</h2>${locked ? '' : '<button class="btn ghost sm" data-x aria-label="Schließen">✕</button>'}</div>` : ''}
    <div class="mb2">${body}</div>
    <div class="mf"></div></div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape' && !locked) close(); };
  const mf = $('.mf', bg);
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = () => { const r = a.onClick ? a.onClick(bg, close) : undefined; if (r !== false) close(); };
    mf.appendChild(b);
  });
  if (!actions.length) mf.remove();
  if (!locked) {
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
    $('[data-x]', bg)?.addEventListener('click', close);
  }
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  onMount && onMount(bg, close);
  setTimeout(() => $('input:not([type=hidden]),select,textarea', bg)?.focus?.(), 30);
  return { el: bg, close };
}
function askConfirm(text, okLabel = 'OK', danger = false) {

function confetti(n = 200, dur = 3000) {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const cols = ['#4f46e5', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#a855f7', '#facc15'];
  const ps = Array.from({ length: n }, () => ({
    x: W * (0.2 + Math.random() * 0.6), y: H * 0.35 + (Math.random() - .5) * H * .1,
    vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 8) * devicePixelRatio,
    s: (6 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: pick(cols), shape: Math.random() < .3 ? 'c' : 'r'
  }));
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = el > dur - 700 ? Math.max(0, (dur - el) / 700) : 1;
    for (const p of ps) {
      p.vy += .55 * devicePixelRatio; p.vx *= .985; p.vy *= .985;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.shape === 'c') { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if (el < dur) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

function ringSVG(value, goal, color, big, small) {
  const r = 50, c = 2 * Math.PI * r, p = goal > 0 ? clamp(value / goal, 0, 1) : 0;
  const done = goal > 0 && value >= goal;
  return `<div class="ring"><svg viewBox="0 0 118 118" width="118" height="118">
    <circle class="ring-bg" cx="59" cy="59" r="${r}" fill="none" stroke-width="12"/>
    <circle class="ring-fg" cx="59" cy="59" r="${r}" fill="none" stroke-width="12" stroke-linecap="round"
      stroke="${done ? 'var(--ok)' : color}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/>
    </svg><div class="ring-label"><div><b>${big}</b><span>${small}</span></div></div></div>`;
}

function renderDash() {
  const t = todayKey(), A = agg();
  const dg = dailyGoal(t), dm = A.byDate[t] || 0;
  const curMon = mondayOf(t);
  const wg = weeklyGoal(curMon), wm = weekMinutes(A, curMon);
  const s = streaks(A);
  const mon = ui.dashWeek || curMon;

  // Countdown

function heatmapHTML(A) {
  const t = todayKey(), curMon = mondayOf(t), WEEKS = 26;
  const start = addDays(curMon, -(WEEKS - 1) * 7);
  let cells = '<div class="hm"></div>' + WD.map((d, i) => `<div class="hl">${i % 2 === 0 ? d : ''}</div>`).join('');
  let lastMonth = -1;
  for (let w = 0; w < WEEKS; w++) {
    const mon = addDays(start, w * 7), m = parseKey(mon).getMonth();
    cells += `<div class="hm">${m !== lastMonth ? MONTHS[m] : ''}</div>`;
    lastMonth = m;
    for (let i = 0; i < 7; i++) {
      const k = addDays(mon, i);
      if (k > t) { cells += '<div class="hc future"></div>'; continue; }
      const v = A.byDate[k] || 0, g = dailyGoal(k);
      let lvl = 0;
      if (v > 0) {
        if (g > 0) { const r = v / g; lvl = r >= 1 ? 4 : r >= .66 ? 3 : r >= .33 ? 2 : 1; }
        else lvl = v < 60 ? 1 : v < 120 ? 2 : v < 240 ? 3 : 4;
      }
      const met = g > 0 && v >= g;
      cells += `<div class="hc l${lvl} ${met ? 'goal' : ''} ${k === t ? 'today' : ''}" title="${fmtDate(k)}: ${fmtDur(v)}${g ? ' von ' + fmtDur(g) + (met ? ' ✓' : '') : ''}"></div>`;
    }
  }
  return `<div class="heat-wrap"><div class="heat">${cells}</div></div>
    <div class="heat-legend">weniger <span class="hc" style="background:var(--heat0)"></span><span class="hc" style="background:var(--heat1)"></span><span class="hc" style="background:var(--heat2)"></span><span class="hc" style="background:var(--heat3)"></span><span class="hc" style="background:var(--heat4)"></span> mehr
    <span style="margin-left:12px"></span><span class="hc" style="background:var(--heat4);box-shadow:inset 0 0 0 2px var(--ok)"></span> Tagesziel erreicht</div>`;
}

function topicsFor(sid) {
  return [...new Set(state.entries.filter(e => e.subjectId === sid && e.topic).sort((a, b) => b.date.localeCompare(a.date)).map(e => e.topic))].slice(0, 30);
}
function entryFormHTML(e, prefix) {
  const h = Math.floor((e.minutes || 0) / 60), m = (e.minutes || 0) % 60;
  return `<div class="form-grid">
    <div class="c6"><label class="f" for="${prefix}Subj">Prüfung</label><select id="${prefix}Subj">${subjOptions(e.subjectId)}</select></div>
    <div class="c6"><label class="f" for="${prefix}Date">Datum</label><input type="date" id="${prefix}Date" value="${e.date}" max="${todayKey()}"></div>
    <div class="c12"><label class="f">Dauer</label><div class="row">
      <div class="dur"><input type="number" id="${prefix}H" min="0" max="23" value="${e.minutes ? h : ''}" placeholder="0" inputmode="numeric"> h
      <input type="number" id="${prefix}M" min="0" max="59" step="5" value="${e.minutes ? m : ''}" placeholder="0" inputmode="numeric"> min</div>
      <div class="chips">${[15, 30, 45, 60, 90, 120].map(x => `<button type="button" class="chip" data-add="${x}" data-p="${prefix}">+${x < 60 ? x + ' min' : (x / 60).toLocaleString('de-DE') + ' h'}</button>`).join('')}
      <button type="button" class="chip" data-clear="${prefix}">0</button></div></div></div>
    <div class="c12"><label class="f" for="${prefix}Topic">Unterthema (optional)</label><input type="text" id="${prefix}Topic" value="${esc(e.topic || '')}" list="${prefix}TopicList" placeholder="z. B. Geldpolitik der EZB" maxlength="120"><datalist id="${prefix}TopicList"></datalist></div>
    <div class="c12"><label class="f" for="${prefix}Note">Notiz (optional)</label><textarea id="${prefix}Note" rows="2" placeholder="Was lief gut, was ist offen?" maxlength="1000">${esc(e.note || '')}</textarea></div>
  </div>`;
}
function bindEntryForm(root, prefix) {
  const fill = () => { $(`#${prefix}TopicList`, root).innerHTML = topicsFor($(`#${prefix}Subj`, root).value).map(t => `<option value="${esc(t)}">`).join(''); };
  $(`#${prefix}Subj`, root).addEventListener('change', fill); fill();
  $$(`[data-add][data-p="${prefix}"]`, root).forEach(b => b.onclick = () => {
    const tot = num($(`#${prefix}H`, root).value) * 60 + num($(`#${prefix}M`, root).value) + +b.dataset.add;
    $(`#${prefix}H`, root).value = Math.floor(tot / 60); $(`#${prefix}M`, root).value = tot % 60;
  });
  $(`[data-clear="${prefix}"]`, root).onclick = () => { $(`#${prefix}H`, root).value = ''; $(`#${prefix}M`, root).value = ''; };
}
function readEntryForm(root, prefix) {
  const minutes = Math.round(num($(`#${prefix}H`, root).value) * 60 + num($(`#${prefix}M`, root).value));
  return { subjectId: $(`#${prefix}Subj`, root).value, date: $(`#${prefix}Date`, root).value, minutes,
    topic: $(`#${prefix}Topic`, root).value.trim(), note: $(`#${prefix}Note`, root).value.trim() };
}
function validEntry(e) {
  if (!e.subjectId) { toast('Bitte eine Prüfung wählen.'); return false; }
  if (!e.date) { toast('Bitte ein Datum wählen.'); return false; }
  if (e.minutes <= 0) { toast('Bitte eine Dauer größer 0 eingeben.'); return false; }
  if (e.minutes > 24 * 60) { toast('Mehr als 24 Stunden an einem Tag? Bitte prüfen.'); return false; }
  return true;
}
function addEntry(e, source = 'manual', planKey) {
  const entry = { id: uid(), subjectId: e.subjectId, date: e.date, minutes: e.minutes, topic: e.topic || '', note: e.note || '', source, created: Date.now() };
  if (planKey) entry.planKey = planKey;
  state.entries.push(entry);
  save();
  return entry;
}
function deleteEntry(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  if (e.planKey) delete state.plan.done[e.planKey];
  state.entries = state.entries.filter(x => x.id !== id);
  save();
}
